# Общие требования к системе
general_requirements:
  database:
    type: PostgreSQL
    note: "ИС НЕ ДОЛЖНА использовать In-memory хранилище"
  message_broker:
    type: RabbitMQ
    note: "ИС должна поддерживать взаимодействие с прочими сервисами через RabbitMQ (помимо API)"
  rabbitmq_topology_rule: |
    Каждый микросервис при запуске самостоятельно объявляет (через @Bean Queue, @Bean Binding) только те очереди,
    из которых он читает, и, возможно, exchange, в который он пишет (если exchange может отсутствовать).
    Обменники, используемые несколькими сервисами, могут быть объявлены в каждом из них – это безопасно.
    Не создавайте отдельный сервис для инициализации топологии RabbitMQ.

# Акторы и их требования
actors:
  - name: Guest
    description: Неавторизованный пользователь
    requirements:
      - id: G1
        title: Регистрация в системе
        description: Незарегистрированный пользователь может создать учётную запись.
      - id: G2
        title: Вход в систему
        description: Зарегистрированный пользователь может аутентифицироваться и получить доступ к функциям системы.
      - id: G3
        title: Ознакомление с описанием сценариев
        description: Гость может просматривать описания доступных сценариев (правил анализа транзакций) без авторизации.

  - name: User
    description: Авторизованный клиент
    requirements:
      - category: Управление профилем
        items:
          - id: U1
            title: Изменение личных данных
            description: Пользователь может редактировать свои персональные данные (ФИО, контакты и т.п.).
          - id: U2
            title: Привязка банковского счёта
            description: Пользователь может привязать один или несколько банковских счетов для анализа транзакций.
            details: "Послать в ИС accountID его аккаунта в Симулякре."
          - id: U3
            title: Отвязка банковского счёта
            description: Пользователь может отвязать ранее привязанный банковский счёт.
          - id: U4
            title: Просмотр привязанного счета
            description: ИС отображает банковский счёт, привязанный к учётной записи пользователя.
          - id: U5
            title: Удаление аккаунта
            description: Пользователь может полностью удалить свою учётную запись с автоматической отвязкой счета.
      - category: Управление ПДА (предварительное данное акцепт)
        items:
          - id: U6
            title: Выдача ПДА
            description: Пользователь может создать новое платёжное поручение (ПДА).
            details: "Отправить запрос в Симулякр и получить ПДА ID в ответ."
          - id: U7
            title: Отзыв ПДА
            description: Пользователь может отозвать ранее выданное ПДА.
          - id: U8
            title: Просмотр статуса ПДА
            description: Пользователь может проверить текущий статус своего ПДА.
      - category: Управление сценариями
        items:
          - id: U9
            title: Активация сценария
            description: Пользователь может активировать сценарий из общего каталога для своего аккаунта.
            details: "Указание индивидуальных параметров (сумма списания)."
          - id: U10
            title: Настройка параметров активируемого сценария
            description: Пользователь может редактировать индивидуальные параметры сценария (например, пороговые суммы, категории MCC).
            details: "Сценарий запрашивается по ID."
          - id: U11
            title: Просмотр списка активных сценариев
            description: Пользователь видит перечень сценариев, активных для его аккаунта.
          - id: U12
            title: Просмотр каталога сценариев
            description: ИС предоставляет доступ к каталогу всех сценариев (неактивированных).
          - id: U13
            title: Деактивация активного сценария
            description: Пользователь может деактивировать любой из своих активных сценариев.
      - category: Взаимодействие с историей
        items:
          - id: U14
            title: Просмотр истории срабатываний активных сценариев
            description: ИС отображает журнал событий, когда активный сценарий пользователя сработал на транзакции.
          - id: U15
            title: Оспаривание списания
            description: Пользователь может оспорить конкретное списание, инициировав соответствующий процесс.
            details: "Реализовать с заглушкой."

  - name: Administrator
    description: Администратор системы
    requirements:
      - category: Управление справочниками и сценариями
        items:
          - id: A1
            title: Добавление нового сценария
            description: Администратор может создавать новые сценарии, указав МСС коды для каждого.
            details: "При существовании сценария с указываемым МСС-кодом новый не создаётся (идемпотентность)."
          - id: A2
            title: Редактирование параметров сценария
            description: Администратор может изменять параметры существующих сценариев.
          - id: A3
            title: Деактивация / удаление сценария
            description: Администратор может деактивировать или полностью удалить сценарий из системы.
      - category: Управление пользователями
        items:
          - id: A4
            title: Просмотр списка пользователей
            description: Администратор видит перечень всех зарегистрированных пользователей.
          - id: A5
            title: Просмотр истории действий пользователя
            description: Администратор может просматривать лог действий (аудит) для любого пользователя.
          - id: A6
            title: Блокировка / разблокировка пользователя
            description: Администратор может заблокировать учётную запись пользователя и разблокировать её.
          - id: A7
            title: Деактивация активного пользовательского сценария
            description: Администратор имеет право принудительно деактивировать любой активный сценарий, принадлежащий пользователю.
      - category: Мониторинг системы
        items:
          - id: A8
            title: Просмотр журнала операций с API Симулякра
            description: Администратор имеет доступ к логу всех запросов, отправленных ИС к сервису «Симулякр».
          - id: A9
            title: Просмотр журнала срабатываний Оракула
            description: Администратор может просматривать журнал событий, обработанных сервисом «Оракул» (какие транзакции были классифицированы и какие триггеры отправлены).
          - id: A10
            title: Просмотр статистики сценариев
            description: Администратор может просматривать агрегированную статистику по использованию сценариев (частота срабатываний для конкретного пользователя).