services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: selfcontrol
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-selfcontrol}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-selfcontrol}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"

volumes:
  postgres_data:

x-application-environment:
  SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://localhost:5432/selfcontrol}
  SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-selfcontrol}
  SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-selfcontrol}
  RABBITMQ_HOST: ${RABBITMQ_HOST:-localhost}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
