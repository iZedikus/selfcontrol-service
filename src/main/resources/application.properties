spring.application.name=selfcontrol

# IS (информационная система) — REST API по REST_КОНТРАКТ.yaml, базовый URL http://is:8080
server.port=8080

# Идентификатор IS для Simulacrum (поле creditorSystemId при POST /api/v1/consents)
app.is.creditor-system-id=${IS_CREDITOR_SYSTEM_ID:00000000-0000-0000-0000-000000000001}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/selfcontrol}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:selfcontrol}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:selfcontrol}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:dev-secret-change-me}
simulacrum.base-url=${SIMULACRUM_BASE_URL:http://localhost:8081}
